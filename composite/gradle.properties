#Kotlin
kotlin.code.style=official
# Keep these JVM args byte-for-byte identical to the root gradle.properties so the build-logic
# (composite) build reuses the SAME Kotlin daemon instead of spawning a second ~4 GB one — Kotlin
# daemons are keyed by their JVM args, so a mismatch means an extra resident daemon on CI.
kotlin.daemon.jvmargs=-Xmx3072m -XX:+UseParallelGC

#Gradle
org.gradle.jvmargs=-Xms512m -Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.kotlin.dsl.allWarningsAsErrors=true
