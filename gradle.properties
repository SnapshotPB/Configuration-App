#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072m -XX:+UseParallelGC
# Bound the Kotlin/Native commonizer's forked JVM. `commonizeNativeDistribution` runs in a SEPARATE
# JVM whose max heap otherwise defaults to 1/4 of physical RAM (~4 GB on a 16 GB CI runner) and is
# NOT counted under org.gradle.jvmargs or kotlin.daemon.jvmargs. On the wasm+iOS CI build this fork
# overlaps the wasm Binaryen pass and the Gradle/Kotlin daemons, pushing total RAM past the runner's
# ~14 GB usable and tripping the kernel OOM-killer. Capping it removes that headroom blowout.
# (Property name verified in JetBrains/kotlin v2.3.20; deprecated alias: kotlin.commonizer.jvmArgs.)
# 2 GB caps it well below the ~4 GB default while leaving margin for commonizing the iOS native
# distribution; the CI build split (validation.yml) keeps the wasm Binaryen pass out of this phase.
kotlin.mpp.commonizerJvmArgs=-Xmx2048m -XX:+UseParallelGC
# Kotlin 2.3.20's wasm incremental compiler intermittently crashes with an ArrayIndexOutOfBounds in
# WasmIrFileMetadata.fromByteArray on edited files (it reuses the JS-IR incremental runner). Disable
# wasm incremental compilation so editing a wasmJs source doesn't require a manual clean each time.
kotlin.incremental.wasm=false

#Gradle
# All Gradle workers share this one daemon heap. The Linux CI runner has 4 CPUs and 15.6 GiB of
# RAM, but the macOS runner of the release build has only 7 GB, so keep this value small. A test
# of the android CI task list on 4 CPUs (2026-10-11) gave the same build time with a heap of
# 3, 4 and 6 GB, so a larger heap does not make the CI build faster.
# One task does not fit: the release link of the iOS framework (:app:ios:linkReleaseFrameworkIosArm64)
# fails with "Java heap space" in 3 GB. On a MacBook it passed with 4 GB (slow) and with 5 GB.
org.gradle.jvmargs=-Xmx3072m -XX:+UseParallelGC
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.kotlin.dsl.allWarningsAsErrors=true
org.gradle.daemon.performance.disable-logging=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Compose KMP
compose.resources.always.generate.accessors=true

# Auto-Updater Build Configuration
snapshotpb.enableAutoUpdater=false

