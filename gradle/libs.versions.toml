[versions]
agp = "9.1.1"
android-baseline = "1.5.0-alpha05"
android-compileSdk = "36"
android-minSdk = "24"
android-targetSdk = "36"
androidx-activity = "1.13.0"
androidx-core = "1.18.0"
androidx-core-splash = "1.2.0"
androidx-espresso = "3.7.0"
androidx-lifecycle = "2.10.0"
androidx-material = "1.13.0"
androidx-navigation3 = "1.1.0-rc01"
androidx-testExt = "1.3.0"
androidx-uiautomator = "2.3.0"
arbor = "3.0.136"
blue-falcon = "3.7.14"
coil = "3.4.0"
compose-hot-reload = "1.0.0"
compose-multiplatform = "1.10.3"
image-picker = "1.0.39"
jna = "5.14.0"
kodein = "7.31.0"
kotlin = "2.3.20"
kotlincrypto-hash = "0.8.0"
kotlinx-browser = "0.5.0"
# Ktor 3.6.0 needs kotlinx-coroutines 1.11.0 and kotlinx-io 0.9.1. The catalog names these
# versions, so each module compiles and tests against the versions that the apps run with.
kotlinx-coroutines = "1.11.0"
kotlinx-datetime = "0.7.1"
kotlinx-io = "0.9.1"
kotlinx-serialization = "1.11.0"
ktor = "3.6.0"
material3 = "1.10.0-alpha05"
protobuf = "0.9.6"
protobufSchema = "4.34.0"
nucleus = "1.15.7"
androidx-wear-compose = "1.3.1"
play-services-wearable = "18.1.0"


# Newer version 0.1.1 is undocumented on the repo and has no tag so treating it as potentially dangerous until proven otherwise
#noinspection NewerVersionAvailable
protogen = "0.1.0"

[libraries]
# Android
androidx-benchmark = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "android-baseline" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-core-splash = { module = "androidx.core:core-splashscreen", version.ref = "androidx-core-splash" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
androidx-material = { module = "com.google.android.material:material", version.ref = "androidx-material" }
androidx-navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "androidx-navigation3" }
androidx-navigation3-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidx-uiautomator" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

# Compose
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose-multiplatform" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }

# Kotlin
kotlin-gradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "kotlinx-browser" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-io = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json-io = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json-io", version.ref = "kotlinx-serialization" }
kotlinx-serialization-protobuf = { module = "org.jetbrains.kotlinx:kotlinx-serialization-protobuf", version.ref = "kotlinx-serialization" }

# BlueFalcon
blue-falcon = { module = "dev.bluefalcon:blue-falcon-core", version.ref = "blue-falcon" }
blue-falcon-android = { module = "dev.bluefalcon:blue-falcon-engine-android", version.ref = "blue-falcon" }
blue-falcon-ios = { module = "dev.bluefalcon:blue-falcon-engine-ios", version.ref = "blue-falcon" }
blue-falcon-js = { module = "dev.bluefalcon:blue-falcon-engine-js", version.ref = "blue-falcon" }
blue-falcon-linux = { module = "dev.bluefalcon:blue-falcon-engine-rpi", version.ref = "blue-falcon" }
blue-falcon-macos = { module = "dev.bluefalcon:blue-falcon-engine-macos", version.ref = "blue-falcon" }
blue-falcon-macos-jvm = { module = "dev.bluefalcon:blue-falcon-engine-macos-jvm", version.ref = "blue-falcon" }
blue-falcon-logging = { module = "dev.bluefalcon:blue-falcon-plugin-logging", version.ref = "blue-falcon" }
blue-falcon-windows = { module = "dev.bluefalcon:blue-falcon-engine-windows", version.ref = "blue-falcon" }

# Other
arbor = { module = "com.toxicbakery.logging:arbor", version.ref = "arbor" }
arbor-android = { module = "com.toxicbakery.logging:arbor-android", version.ref = "arbor" }
coil = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
image-picker = { module = "io.github.ismoy:imagepickerkmp", version.ref = "image-picker" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
protobuf-kotlin-gen = { module = "io.github.dogacel:kotlinx-protobuf-gen", version.ref = "protogen" }
androidx-wear-compose-material = { module = "androidx.wear.compose:compose-material", version.ref = "androidx-wear-compose" }
androidx-wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "androidx-wear-compose" }
play-services-wearable = { module = "com.google.android.gms:play-services-wearable", version.ref = "play-services-wearable" }

# Ktor: the HTTP client of core:firmware. Each platform picks its engine. Android uses the
# Android engine (HttpURLConnection), not OkHttp: the OkHttp 5.5.0 of Ktor 3.6.0 needs
# compileSdk 37.
ktor-client-android = { module = "io.ktor:ktor-client-android", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# SHA-256 in common code, for the check of a firmware download
kotlincrypto-hash-sha2 = { module = "org.kotlincrypto.hash:sha2", version.ref = "kotlincrypto-hash" }

# Kodein
kodein = { module = "org.kodein.di:kodein-di", version.ref = "kodein" }
kodein-compose = { module = "org.kodein.di:kodein-di-framework-compose", version.ref = "kodein" }
kodein-compose-runtime = { module = "org.kodein.di:kodein-di-framework-compose-runtime", version.ref = "kodein" }
nucleus-updater = { module = "io.github.kdroidfilter:nucleus.updater-runtime", version.ref = "nucleus" }


[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidBaseline = { id = "androidx.baselineprofile", version.ref = "android-baseline" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
# Deliberately versionless, unlike the AGP plugins above. `com.android.test` ships in the same
# artifact as `com.android.application`/`com.android.library`, so it is already on the buildscript
# classpath by the time :app:android:baseline requests it. Adding `version.ref = "agp"` makes Gradle
# fail the build outright: "the plugin is already on the classpath with an unknown version, so
# compatibility cannot be checked". It therefore tracks the `agp` version by construction.
androidTest = { id = "com.android.test" }
composeHotReload = { id = "org.jetbrains.compose.hot-reload", version.ref = "compose-hot-reload" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# The version here is a placeholder. settings.gradle.kts overrides it with a digest of
# composite/src, so the coordinate only resolves when composite/m2 holds the current build
# logic. Run `./gradlew -p composite clean test publish` after editing composite/src.
composite = { id = "composite", version = "1.0" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf" }
nucleus = { id = "io.github.kdroidfilter.nucleus", version.ref = "nucleus" }

