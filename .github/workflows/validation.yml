name: Validate Pull Request
on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]
    types: [ opened, reopened, synchronize ]
    paths-ignore:
      - 'app/zepp/**'
  # A push to master runs the same matrix and writes the Gradle caches. A PR job restores
  # the newest entry that has the same job id, workflow name and matrix values, so each
  # target reads the entry that its own master run wrote. This replaced the cache.yml
  # workflow, which built every target on one runner in about 27 minutes and was often
  # cancelled by the next merge. That left PR jobs with a cache that was several merges old.
  push:
    branches: [ master ]
    paths-ignore:
      - 'app/zepp/**'

# Cancel an in-flight PR matrix when the PR gets a new push, because the older commit is
# superseded. Do not cancel a run on master: it writes the Gradle caches that the PR jobs read,
# and a cancelled master run leaves the PR jobs with an older cache.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job gets only the token scopes that it needs.
permissions:
  contents: read

jobs:
  # The scripts under scripts/ have unit tests, for example the release scripts (cut_version.py,
  # stage_release_manifest.py). release.yml runs the tests before it cuts a tag. This job runs
  # them on a PR that changes scripts/ too, so that a defect shows before the release day. It
  # also runs the unit tests of the BLE validation tools (tools/ble-validation/tests).
  scripts:
    name: Validate (release scripts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # A PR checks out its merge commit. Depth 2 also gets the two parents of that commit,
          # so the next step can compare the PR with its base without a second fetch.
          fetch-depth: 2
          persist-credentials: false

      - name: Find changes under scripts/
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A push to master or a manual run always runs the tests. A PR runs them only when
          # it changes a file under scripts/, tools/ble-validation/ or this workflow.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^1 HEAD | grep -qE '^(scripts/|tools/ble-validation/|\.github/workflows/validation\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.changes.outputs.run == 'true'
        with:
          python-version: '3.x'

      - name: Test the release scripts
        if: steps.changes.outputs.run == 'true'
        run: python3 -m unittest discover -s scripts/tests

      - name: Test the BLE validation tools
        if: steps.changes.outputs.run == 'true'
        run: python3 -m unittest discover -s tools/ble-validation/tests

  validate:
    name: Validate (${{ matrix.target }})
    # Only the macos target needs a macOS runner. The runner comes from the target name and not
    # from a new matrix value: setup-gradle puts the matrix values in its cache key, so a new
    # value on the Linux targets makes their PR jobs miss the entries that master wrote.
    runs-on: ${{ matrix.target == 'macos' && 'macos-latest' || 'ubuntu-latest' }}
    permissions:
      contents: read
      # setup-gradle writes a PR comment when a job fails (add-job-summary-as-pr-comment).
      # GitHub Actions cannot set a permission from an expression, so a push run on master
      # also gets this scope. The push run writes no comment.
      pull-requests: write
    strategy:
      # One target failing shouldn't cancel the others — surface every target's result in one run.
      fail-fast: false
      matrix:
        # Each target builds on its OWN runner. This is what kills the build-time explosion AND the
        # OOM that forced the old --no-parallel/--no-daemon/two-pass workaround: the wasm Binaryen pass
        # (browser) and the Kotlin/Native iOS commonizer/konanc (ios) now run in separate process trees
        # on separate machines, so they can never peak together. Wall-clock drops from the SUM of every
        # target (built single-threaded) to the MAX of the five jobs (built in parallel, full cores).
        #
        # The repository is public, so the standard Linux runner has 4 CPUs (2 cores with 2 threads
        # each) and 15.6 GiB of RAM (measured on 2026-10-11). Gradle sets its worker count from
        # the CPU count, so four tasks run at the same time. Each task that a target does not
        # need still costs wall-clock time. The standard macOS runner has 3 CPUs and 7 GB of RAM
        # (GitHub documentation), and it is free of charge for a public repository.
        #
        # The task lists cover what the old `./gradlew build` on a Linux runner checked:
        #   android  — :app:android + :app:wear debug and release APKs, a compile check of the
        #              baseline module and of the instrumented tests of both apps, plus `lint`
        #              for both apps and the android libraries
        #   desktop  — :app:desktop assemble, plus `jvmTest` (runs core:bluetooth/core:model commonTest)
        #   browser  — :app:browser wasm/Binaryen, plus `wasmJsBrowserTest` (same commonTest on wasm)
        #   ios      — :app:ios klibs + native commonizer. The job only compiles. A Linux host cannot
        #              link an Apple framework or run an iOS test, so Gradle skips those tasks.
        #   macos    — the tasks that the ios target cannot do: the debug link of the ComposeApp
        #              framework for the device and for the simulator, plus `iosSimulatorArm64Test`
        #              (the same commonTest on the iOS Simulator).
        #
        # The macos target runs Gradle with one worker (`gradle-args`). A Kotlin/Native link runs in
        # the Gradle daemon. On its first use of a library, it makes the compiler cache of that
        # library in ~/.konan. The largest one is material-icons-extended, which imagepickerkmp
        # brings in. During this work, one link holds about 1.5 GB of the 3 GB Gradle heap. With
        # three workers, the two framework links and a test link ran at the same time, and the
        # first run on the runner failed with "Java heap space" after 30 minutes. One worker lets
        # only one link use the heap at a time.
        #
        # Measured on a MacBook with the JVM limited to 3 CPUs and the heap of gradle.properties:
        #   empty ~/.konan, one worker    — 8 minutes, 8.8 GB of RAM (daemon 5.8 GB, clang++ 2.9 GB)
        #   full ~/.konan, one worker     — 82 seconds, 3.1 GB of RAM
        #   full ~/.konan, three workers  — 52 seconds, 4.6 GB of RAM
        # A run with an empty ~/.konan thus needs more RAM than the 7 GB of the runner, and macOS
        # must compress or swap memory. On the runner, such a run passed in 23 minutes
        # (2026-10-12). It occurs only when the cache step below finds no entry, or after an
        # update of Kotlin or of a Compose library.
        #
        # The macos target does not link the release framework, so the first release link is still
        # the macOS job of build-release.yml. The release link of iosArm64 fails with "Java heap
        # space" in the 3 GB Gradle heap of gradle.properties. On a MacBook it passed with a heap
        # of 5 GB, and the Gradle daemon and clang then used about 13 GB of RAM, which the 7 GB
        # runner does not have. `:app:ios:build` links the two release frameworks, so do not use
        # it on macOS.
        #
        # The android target does not run `:app:android:build`. The baseline profile plugin adds the
        # nonMinifiedRelease and benchmarkRelease variants to :app:android, and the build script adds
        # the benchmark variant, so `build` assembled five variants with three R8 passes. A PR job
        # cannot generate a profile, because that needs a connected device, so the three extra
        # variants only cost about four minutes. `:app:android:baseline:compileBenchmarkReleaseKotlin`
        # still type-checks the generator. Neither app has unit tests, so `build` added no test.
        # `lint` runs the default-variant lint of every project; the lint vital pass of the release
        # variants is off in both app build scripts, because it analyzed the same sources again.
        #
        # :core:resources:localizationCheck is named explicitly on the desktop target. A project's
        # `build` depends on that project's OWN `check` only — a project dependency contributes
        # assemble-side outputs, not `check` — so :app:*:build never reaches it. An unqualified
        # `check` would instead run every project's checks, which is far more than this needs.
        include:
          - target: android
            tasks: ":app:android:assembleDebug :app:android:assembleRelease :app:android:baseline:compileBenchmarkReleaseKotlin :app:android:compileDebugAndroidTestKotlin :app:wear:assembleDebug :app:wear:assembleRelease :app:wear:compileDebugAndroidTestKotlin lint"
          - target: desktop
            tasks: ":app:desktop:build jvmTest :core:resources:localizationCheck"
          - target: browser
            tasks: ":app:browser:build wasmJsBrowserTest"
          - target: ios
            tasks: ":app:ios:build"
          - target: macos
            tasks: ":app:ios:linkDebugFrameworkIosArm64 :app:ios:linkDebugFrameworkIosSimulatorArm64 iosSimulatorArm64Test"
            # Only this entry has the key, so the matrix values of the Linux targets, and thus
            # their Gradle cache keys, do not change.
            gradle-args: "--max-workers=1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: 'true'
          submodules: 'true'
          # The build runs third-party Gradle plugins. Do not keep the token in .git/config.
          persist-credentials: false

      # The JetBrains JDK, not Temurin: gradle/gradle-daemon-jvm.properties makes the Gradle
      # daemon run on a JetBrains JDK 21. With a different JDK here, Gradle downloads that
      # JDK through the foojay API, and only the Gradle cache hides a failure of that
      # download. On 2026-10-08 foojay had no JetBrains JDK 21.
      - uses: actions/setup-java@v6
        with:
          distribution: 'jetbrains'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          # The action's default package list still asks for the obsolete 'tools' package, which
          # Google removed from the SDK repository. sdkmanager then fails the job before Gradle runs.
          packages: 'platform-tools'

      # Kotlin/Native keeps the compiler + commonized platform libs in ~/.konan, which lives OUTSIDE
      # the Gradle user home that setup-gradle caches. Without this the iOS job re-downloads konan and
      # recompiles the native platform libraries on every run. Only the ios and macos targets use
      # native, so the cache is scoped to them, and `runner.os` gives each of them its own
      # entry; the key tracks the Kotlin/AGP versions pinned in the version catalog.
      # A run on master writes the entry when the key is new. A PR run restores it.
      - name: Cache Kotlin/Native (~/.konan)
        if: matrix.target == 'ios' || matrix.target == 'macos'
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Build scans go to the public scans server, and this repository is private. The
          # Develocity plugin in settings.gradle.kts publishes a scan only for a failed build
          # on CI, so this step does not inject a second plugin and the build has no --scan.
          #
          # Only a run on master writes the caches. A PR run reads them, so parallel PR jobs
          # cannot evict the master entries, and every PR job skips the slow cache-save step.
          # The configuration cache is not stored: setup-gradle stores it only with an
          # encryption key, and the entry would be invalid on the next commit in any case,
          # because resolveProjectVersion() puts the `git describe` output into the build inputs.
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
          # Five jobs would otherwise post five scan comments per PR — only comment when one fails.
          add-job-summary-as-pr-comment: 'on-failure'

      # `composite` is a SEPARATE Gradle build with its own settings.gradle.kts, consumed as a
      # pre-published jar from composite/m2 rather than via includeBuild. No root task reaches it,
      # so its unit tests would never run. They guard the rules that decide whether
      # :core:resources:localizationCheck fails the build, the version mapping, and the parity
      # of the two buildLogicVersion() copies, so run them on the cheapest target.
      # --no-daemon: the composite build has different org.gradle.jvmargs, so it cannot reuse
      # the daemon of the root build. Without this flag a second daemon stays in memory for the
      # full desktop build.
      - name: Test build logic (composite)
        if: matrix.target == 'desktop'
        run: ./gradlew -p composite test --no-daemon --stacktrace -Dorg.gradle.console=plain

      # No --no-parallel / --no-daemon / build-split needed anymore: each runner builds a single target
      # family, so org.gradle.parallel (gradle.properties) and the setup-gradle-managed daemon are back
      # on and peak RAM stays under the 15.6 GiB of the Linux runner. The macos target is the
      # exception: its `gradle-args` sets one worker (see the matrix comment).
      - name: Build ${{ matrix.target }}
        run: ./gradlew ${{ matrix.tasks }} ${{ matrix.gradle-args }} --stacktrace -Dorg.gradle.console=plain

      # The console gives only the name of a failed test. A browser test that Mocha stops after
      # its time limit shows as the bare text "Error". The reports hold the message and the stack
      # trace, so a failed job keeps them. The glob also gets the reports of the composite build.
      # The artifact needs no token scope, and this job reads no secret, so the reports hold none.
      - name: Upload the test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.target }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/reports/lint-results-*
            !**/node_modules/**
          if-no-files-found: ignore
          retention-days: 14
